<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset="0.42" stop-color="#15102A"/>
      <stop offset="0.72" stop-color="#10243A"/>
      <stop offset="1" stop-color="#071B1A"/>
    </linearGradient>
    <linearGradient id="orb1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="orb2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="1030" cy="50" r="135" fill="url(#orb1)" opacity=".28" filter="url(#blur)"/>
  <circle cx="210" cy="315" r="125" fill="url(#orb2)" opacity=".20" filter="url(#blur)"/>

  <g opacity=".8">
    <circle cx="965" cy="118" r="4" fill="#A855F7"/>
    <circle cx="1000" cy="148" r="3" fill="#22D3EE"/>
    <circle cx="1080" cy="105" r="5" fill="#34D399"/>
    <circle cx="1040" cy="185" r="2" fill="#F472B6"/>
  </g>

  <rect x="70" y="64" width="145" height="30" rx="15" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="142" y="84" text-anchor="middle" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ENGINEERING LAB</text>

  <text x="70" y="153" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">Sudhanshu Sharma</text>
  <text x="70" y="194" fill="#D4D4D8" font-family="Arial, Helvetica, sans-serif" font-size="21">Quality Engineering • Automation • IoT • Developer Productivity</text>
  <text x="70" y="244" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">BUILD → TEST → OBSERVE → IMPROVE</text>

  <g transform="translate(70 286)">
    <rect width="110" height="32" rx="16" fill="#A855F7" fill-opacity=".14" stroke="#A855F7" stroke-opacity=".45"/>
    <text x="55" y="21" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">AUTOMATION</text>

    <rect x="122" width="92" height="32" rx="16" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".45"/>
    <text x="168" y="21" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">QUALITY</text>

    <rect x="226" width="70" height="32" rx="16" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".45"/>
    <text x="261" y="21" text-anchor="middle" fill="#D1FAE5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">IOT</text>
  </g>
</svg>
